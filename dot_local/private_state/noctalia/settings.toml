config_version = 16

[bar.default]
background_opacity = 0.89999997988343239
center = [ "media", "active_window" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "clock"
]
margin_ends = 650

[lockscreen]
transition = []
transition_duration = 0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1720.0
    cy = 1321.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
follow_focused_output = true
monitors = []

[plugins]
enabled = [ "noctalia/umbriel-companion" ]

[shell]
umbriel_audio_provider_enabled = true
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = false

[theme]
builtin = "Catppuccin"
community_palette = "Murasaki"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "umbriel" ]
    community_ids = [ "yazi" ]

[wallpaper]
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb", "vortex", "pixel", "diamond", "golden", "melt" ]
transition_duration = 1500

    [wallpaper.default]
    path = "/home/alex/Pictures/Wallpapers/wallhaven-9mjoy1.png"

    [wallpaper.last]
    path = "/home/alex/Pictures/Wallpapers/wallhaven-9mjoy1.png"

    [wallpaper.monitors.DP-1]
    path = "/home/alex/Pictures/Wallpapers/wallhaven-9mjoy1.png"

    [wallpaper.monitors.DP-2]
    path = "/home/alex/Pictures/Wallpapers/wallhaven-9mjoy1.png"

[widget.active_window]
max_length = 700
title_scroll = "on_hover"

[widget.control-center]
enabled = false

[widget.media]
enabled = false

[widget.network]
show_label = false
show_vpn_label = true

[widget.tray]
drawer = true

[widget.volume]
show_label = false