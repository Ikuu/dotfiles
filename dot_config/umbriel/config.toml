# Umbriel configuration
#
# Everything lives in cfg/, one file per topic. Most changes apply on save;
# autostart and environment changes need an Umbriel restart.
# Check edits with `umbriel config validate`.
#
# Reference: https://docs.noctalia.dev/umbriel/
# Starter config with every option: /usr/share/umbriel/config.toml

[include]
files = [
  "cfg/general.toml",     # Autostart, environment, session options
  "cfg/display.toml",     # Monitors
  "cfg/input.toml",       # Keyboard, mouse, focus, hot corners
  "cfg/layout.toml",      # Scrolling layout, column widths, workspaces
  "cfg/appearance.toml",  # Corners, blur, scratchpad dim
  "cfg/keybinds.toml",
  "cfg/rules.toml",       # Window rules, scratchpads, layer rules
]

# Generated by Noctalia from the wallpaper colours. Don't edit.
[include.optional]
files = ["noctalia.toml"]
