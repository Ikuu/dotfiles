# ── Window rules ────────────────────────────────────────────────────────────
# Rules apply in order; later values override earlier ones. Regexes match
# anywhere in the value, so anchor with ^ and $. `umbriel windows` shows app
# IDs and titles.
# https://docs.noctalia.dev/umbriel/window-rules/

# All windows: blur over the cached wallpaper blur.
[[window_rule]]
blur = true

# ── Floating windows ────────────────────────────────────────────────────────

[[window_rule]]
match.app_id             = "^dev\\.noctalia\\.Noctalia$"  # Noctalia settings
default_floating         = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id             = "^dev\\.noctalia\\.UmbrielSharePicker$"  # Screen share picker
default_floating         = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id     = "^com\\.gabm\\.satty$"  # Screenshot annotator (dot-screenshot)
default_floating = true

[[window_rule]]
match.title      = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Bitwarden extension pop-out in Waterfox.
[[window_rule]]
match.app_id     = "^waterfox$"
match.title      = "^Extension: \\(Bitwarden"
default_floating = true

# ReSkate launcher (~/Games/ReSkate).
[[window_rule]]
match.app_id     = "^reskatelauncher\\.exe$"
default_floating = true

# Steam: float everything except the main window and Big Picture. Umbriel has
# no `exclude`, so a negative lookahead on the title does it.
[[window_rule]]
match.app_id     = "^steam$"
match.title      = "^(?![Ss]team$)(?!.*[Bb]ig [Pp]icture)"
default_floating = true

# Notification toasts (Steam etc.): bottom-right, pinned, don't take focus.
[[window_rule]]
match.title      = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused  = false
default_pinned   = true

# ── Drop-down terminal (Mod+`) ──────────────────────────────────────────────
# A Ghostty with its own app ID so normal terminals aren't caught.
# scripts/scratchpad-autohide.py re-sizes and centres it per monitor; keep its
# WIDTH/HEIGHT in sync with default_floating_size.

[[scratchpad]]
name             = "terminal"
spawn_when_empty = "ghostty --class=com.mitchellh.ghostty.quake --background-opacity=0.5"

[[window_rule]]
match.app_id          = "^com\\.mitchellh\\.ghostty\\.quake$"
default_scratchpad    = "terminal"
default_floating_size = { width = 0.4, height = 0.45 }
default_position      = { x = 0, y = 0, anchor = "center" }
blur_optimized        = false  # Blur the windows behind it, not the wallpaper

# ── Startup layout ──────────────────────────────────────────────────────────
# Only windows opened at login (first 60s); later ones open as usual. The apps
# are started from general.toml. DP-1 workspace 2: Discord left, Obsidian
# right (scripts/startup-obsidian.sh starts Obsidian after Discord).

[[window_rule]]
match.app_id      = "^discord$"
match.at_startup  = true
default_output    = "DP-1"
default_workspace = 2

[[window_rule]]
match.app_id      = "^md\\.obsidian\\.Obsidian$"
match.at_startup  = true
default_output    = "DP-1"
default_workspace = 2

# ── Game streaming (Sunshine) ───────────────────────────────────────────────
# Sunshine streams the virtual output "sunshine", which only exists during a
# session (~/.config/sunshine/umbriel-output.sh). Outside a session
# default_output is ignored and these windows open as usual.
# https://github.com/noctalia-dev/umbriel/blob/main/docs/user/streaming.md

[[window_rule]]
match.app_id       = "^steam$"
match.title        = "[Bb]ig [Pp]icture"
default_output     = "sunshine"
default_fullscreen = true

# Proton games launched from Big Picture.
[[window_rule]]
match.app_id   = "^steam_app_"
default_output = "sunshine"

# ── Layer rules (Noctalia bar, panels, notifications) ───────────────────────
# Blur only shows where Noctalia is translucent.
# https://docs.noctalia.dev/umbriel/layer-rules/

[[layer_rule]]
match.namespace   = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur              = true
blur_ignore_alpha = 0.5
blur_popups       = true

# These open over windows, so blur the live content behind them. The bar and
# desktop widgets sit on the wallpaper and keep the cached blur.
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized  = false
