# ────────────── Window Rules ──────────────
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur windows over the cached wallpaper blur. Set blur_optimized = false to
# include overlapping windows behind them, at a GPU cost on every frame that
# moves anything behind them.
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Steam: float everything except the main "Steam" window.
# (Umbriel has no `exclude`, so a negative lookahead on the title does the job.)
[[window_rule]]
match.app_id = "^steam$"
match.title = "^(?![Ss]team$)"
default_floating = true

# Satty (screenshot annotator, used by dot-screenshot)
[[window_rule]]
match.app_id = "^com\\.gabm\\.satty$"
default_floating = true

# Quake-style drop-down terminal (Mod+`). The --class gives this Ghostty its
# own app ID so normal terminals aren't caught by the rule.
[[scratchpad]]
name = "terminal"
spawn_when_empty = "ghostty --class=com.mitchellh.ghostty.quake --background-opacity=0.5"

[[window_rule]]
match.app_id = "^com\\.mitchellh\\.ghostty\\.quake$"
default_scratchpad = "terminal"
default_floating_size = { width = 0.4, height = 0.45 }
default_position = { x = 0, y = 0, anchor = "center" }
# Blur the windows behind it, not just the cached wallpaper blur.
blur_optimized = false

