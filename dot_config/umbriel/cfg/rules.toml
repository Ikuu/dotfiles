# ────────────── Layer Rules ──────────────
# https://docs.noctalia.dev/umbriel/layer-rules/

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Panels, the dock, notifications and OSDs open over windows, so they blur the
# live content behind them. The bar and desktop widgets sit on the wallpaper and
# keep the cached wallpaper blur.
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ────────────── Startup Layout ──────────────
# Only for windows opened at login (match.at_startup); apps opened later go
# wherever they normally would. The apps are started from autostart.toml.

# DP-1 workspace 2: Discord (left), then Obsidian (right). Obsidian is started
# after Discord by scripts/startup-obsidian.sh so it lands to the right.
[[window_rule]]
match.app_id = "^discord$"
match.at_startup = true
default_output = "DP-1"
default_workspace = 2

[[window_rule]]
match.app_id = "^md\\.obsidian\\.Obsidian$"
match.at_startup = true
default_output = "DP-1"
default_workspace = 2
