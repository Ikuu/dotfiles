# ── Input ───────────────────────────────────────────────────────────────────
# https://docs.noctalia.dev/umbriel/input/

[input.keyboard]
numlock_toggle = true  # NumLock on when a keyboard connects

[input.mouse]
accel_profile = "flat"  # No pointer acceleration
sensitivity   = 0.0

[input.focus]
follows_mouse = true

# ── Hot corners ─────────────────────────────────────────────────────────────

[hot_corners.top_left]
enabled  = true
delay_ms = 500
action   = "overview-open"
