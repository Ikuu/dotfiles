# ── Layout ──────────────────────────────────────────────────────────────────
# Scrolling layout (the default mode). Widths are fractions of the monitor.
# https://docs.noctalia.dev/umbriel/layout/

[layout]
extent_presets = [0.333, 0.5, 0.667]  # Cycled by Mod+R (width) / Mod+Ctrl+R (height)

[layout.scrolling]
default_extent_fraction = 0.5  # New columns open at half the screen width

# ── Workspaces ──────────────────────────────────────────────────────────────

[workspaces]
back_and_forth = true  # Picking the current workspace goes back to the previous one
