## Video
profile=high-quality

## Screenshots
screenshot-format=png
screenshot-dir="~/Pictures/mpv"
screenshot-template="%F-%n"

## HDR
# gpu-next tells the compositor what the video is, so Umbriel's hdr = "auto"
# can switch DP-1 into HDR for fullscreen HDR videos.
vo=gpu-next
target-colorspace-hint=yes

# Only for HDR videos: output real HDR instead of tone-mapping to the SDR
# screen mpv starts on. SDR videos are left alone, so they don't trigger HDR.
[hdr]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-trc=pq
target-prim=bt.2020
target-peak=1000
