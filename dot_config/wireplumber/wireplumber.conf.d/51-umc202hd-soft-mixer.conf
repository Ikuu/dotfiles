# UMC202HD: keep the hardware output mixer at 0 dB and do volume in software.
# Otherwise PipeWire writes volume into the hw mixer, alsa-restore saves it,
# and it comes back as 41% (104/127 = -23 dB) on boot/login.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.usb-BEHRINGER_UMC202HD_192k-00" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
